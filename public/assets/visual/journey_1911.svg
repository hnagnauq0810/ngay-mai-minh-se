<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Một hành trình chuẩn bị"><defs><radialGradient id="g"><stop stop-color="#2f5057"/><stop offset="1" stop-color="#13222a"/></radialGradient></defs><rect width="1280" height="720" fill="url(#g)"/><g fill="none" stroke="#73918d" opacity=".25"><circle cx="1150" cy="80" r="190"/><circle cx="1150" cy="80" r="230"/><path d="M50 550H1220 M50 565H1220"/></g><g font-family="Arial, sans-serif"><text x="70" y="75" fill="#d9b77f" letter-spacing="5" font-size="18">NGÀY MAI, MÌNH SẼ… · ĐỒ HỌA GIẢI THÍCH</text><text x="70" y="138" fill="#fff4dd" font-size="37" font-weight="700">Một hành trình chuẩn bị</text><text x="70" y="187" fill="#aac5c0" font-size="27">1911–1930</text><path d="M110 240H930" fill="none" stroke="#d9b77f" stroke-width="3"/><g><rect x="70" y="270" width="350" height="230" rx="18" fill="#263c43" stroke="#73918d"/><circle cx="110" cy="240" r="24" fill="#e4b573"/><text x="110" y="249" text-anchor="middle" fill="#17252b" font-size="23" font-weight="bold">1</text><text x="95" y="320" font-size="24" fill="#f4c885" font-weight="700">1911</text><text x="95" y="374" font-size="24" fill="#edf0df"><tspan x="95" dy="0">Rời Tổ quốc tìm đường cứu</tspan><tspan x="95" dy="31">nước</tspan></text></g><g><rect x="460" y="270" width="350" height="230" rx="18" fill="#263c43" stroke="#73918d"/><circle cx="500" cy="240" r="24" fill="#e4b573"/><text x="500" y="249" text-anchor="middle" fill="#17252b" font-size="23" font-weight="bold">2</text><text x="485" y="320" font-size="24" fill="#f4c885" font-weight="700">1920</text><text x="485" y="374" font-size="24" fill="#edf0df"><tspan x="485" dy="0">Bước ngoặt lựa chọn con</tspan><tspan x="485" dy="31">đường</tspan></text></g><g><rect x="850" y="270" width="350" height="230" rx="18" fill="#263c43" stroke="#73918d"/><circle cx="890" cy="240" r="24" fill="#e4b573"/><text x="890" y="249" text-anchor="middle" fill="#17252b" font-size="23" font-weight="bold">3</text><text x="875" y="320" font-size="24" fill="#f4c885" font-weight="700">THẬP NIÊN 1920</text><text x="875" y="374" font-size="24" fill="#edf0df"><tspan x="875" dy="0">Truyền bá lý luận, đào</tspan><tspan x="875" dy="31">tạo, tổ chức</tspan></text></g><text x="70" y="616" fill="#b5c7c2" font-size="19">Minh họa biên tập từ lời dẫn · Không phải ảnh tư liệu hay văn kiện gốc</text><text x="70" y="657" fill="#d9b77f" font-size="20">1911–1930</text></g></svg>